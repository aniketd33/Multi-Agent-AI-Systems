[pytest]
asyncio_mode = auto

# Collect tests only from the maintained tests folder
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

minversion = 7.0
pythonpath = .

addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    asyncio: mark test as async
    slow: mark test as slow
    integration: mark test as integration test